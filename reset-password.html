<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set your password | Namaste Nirvana Massage</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="auth-extra.css">
</head>
<body>
<header class="site-header">
  <nav class="wrap nav" aria-label="Main">
    <a class="logo" href="./">Namaste Nirvana</a>
    <a class="btn small ghost" href="auth.html">Sign in</a>
  </nav>
</header>

<main class="wrap auth-page">
  <div class="auth-card">
    <h1 id="title">Choose a new password</h1>
    <p class="lead" id="lead">Checking your link...</p>

    <form id="reset" novalidate hidden>
      <label>New password<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Type it again<input name="again" type="password" autocomplete="new-password" required></label>
      <button class="btn" type="submit">Save password</button>
    </form>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <p class="auth-links" id="expired" hidden>
      <a href="forgot-password.html">Send me a new link</a>
      <a href="auth.html">Back to sign in</a>
    </p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
<script>
// Used for both "forgot password" links and new-user invites. The email link signs the
// person in for this one page; saving a password finishes the job.
const form = document.getElementById('reset');
const statusEl = document.getElementById('status');
const isInvite = /type=invite/.test(location.hash) || new URLSearchParams(location.search).has('invite');
let shown = false;

function showForm() {
  if (shown) return;
  shown = true;
  document.getElementById('title').textContent = isInvite ? 'Welcome! Set your password' : 'Choose a new password';
  document.getElementById('lead').textContent = isInvite
    ? 'You\'ve been invited to Namaste Nirvana. Pick a password to finish setting up.'
    : 'Pick something at least 8 characters long.';
  form.hidden = false;
  form.password.focus();
}

sb.auth.onAuthStateChange((event, session) => {
  if (session && (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN' || event === 'INITIAL_SESSION')) showForm();
});

// If no session shows up shortly, the link was used already or has expired.
setTimeout(() => {
  if (shown) return;
  document.getElementById('lead').textContent = 'This link has expired or was already used.';
  document.getElementById('expired').hidden = false;
}, 2500);

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const problem = passwordProblem(form.password.value, form.again.value);
  if (problem) return say(statusEl, problem, true);
  busy(form.querySelector('button'), async () => {
    const { error } = await sb.auth.updateUser({ password: form.password.value });
    if (error) return say(statusEl, error.message, true);
    say(statusEl, 'Password saved. Taking you to your account...');
    setTimeout(() => location.replace('account.html'), 1200);
  });
});
</script>
</body>
</html>
