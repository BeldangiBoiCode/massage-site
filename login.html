<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Namaste Nirvana Massage</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <nav class="wrap nav" aria-label="Main">
    <a class="logo" href="./">Namaste Nirvana</a>
    <a class="btn small ghost" href="./#book">Book</a>
  </nav>
</header>

<main class="wrap auth-page">
  <div class="auth-card">
    <h1>Sign in</h1>
    <p class="lead">Save your details, see your visits and get reminders. New here? Signing in makes your profile.</p>

    <div class="oauth">
      <button class="btn oauth-btn" data-provider="google" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.3a12 12 0 0 0 0 10.8z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1c.9-2.9 3.6-4.9 6.7-4.9z"/></svg>
        Continue with Google
      </button>
      <button class="btn oauth-btn apple" data-provider="apple" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M16.4 12.7c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.8 1.2 1.8 2.6 3.1 2.5 1.2 0 1.7-.8 3.2-.8s1.9.8 3.2.8c1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.6-1-2.6-4.2zM13.9 5.1c.7-.8 1.2-2 1-3.1-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.4z"/></svg>
        Continue with Apple
      </button>
    </div>

    <p class="divider"><span>or use your email</span></p>

    <form id="email-form" novalidate>
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <button class="btn" type="submit">Email me a sign-in link</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="supabase-client.js"></script>
<script>
const status = document.getElementById('status');
const redirectTo = SITE_BASE + 'account.html';

currentUser().then((u) => { if (u) location.replace('account.html'); });

document.querySelectorAll('[data-provider]').forEach((b) =>
  b.addEventListener('click', async () => {
    const { error } = await sb.auth.signInWithOAuth({ provider: b.dataset.provider, options: { redirectTo } });
    if (error) { status.className = 'status error'; status.textContent = error.message; }
  })
);

document.getElementById('email-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = e.target.email.value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) {
    status.className = 'status error';
    status.textContent = 'Enter an email like name@example.com.';
    return;
  }
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: redirectTo } });
  if (error) { status.className = 'status error'; status.textContent = error.message; return; }
  status.className = 'status';
  status.textContent = `Sent. Check ${email} and tap the link to sign in.`;
});
</script>
</body>
</html>
